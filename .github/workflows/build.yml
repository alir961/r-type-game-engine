name: Build
on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'
jobs:
  build-project:
    name: Build Project
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.1
      - name: Install dependencies and build
        run: ./install.sh --deps
      - name: Multiplayer integration test
        run: python3 tests/integration/multiplayer_test.py build/out/server/r-type_server

  build-windows:
    name: Build Project (Windows)
    runs-on: windows-2022
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-cache
    steps:
      - uses: actions/checkout@v4
      - name: Restore vcpkg packages
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: vcpkg-cache
          key: vcpkg-windows-${{ hashFiles('vcpkg.json', 'triplets/*') }}
      - name: Install dependencies and build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force vcpkg-cache | Out-Null
          .\install.ps1
      # Saved even when the game fails to build, so the next run doesn't recompile SFML.
      - name: Save vcpkg packages
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: vcpkg-cache
          key: vcpkg-windows-${{ hashFiles('vcpkg.json', 'triplets/*') }}
      - name: Multiplayer integration test
        run: python tests/integration/multiplayer_test.py build/out/server/r-type_server.exe
      - name: Client starts and loads its modules
        shell: pwsh
        run: |
          $client = Start-Process build\out\client\r-type_client.exe -PassThru -RedirectStandardOutput client.log -RedirectStandardError client.err
          Start-Sleep -Seconds 8
          Get-Content client.log, client.err
          if ($client.HasExited) { throw "client exited early with code $($client.ExitCode)" }
          Stop-Process -Id $client.Id

  unit-tests:
    name: Engine unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build tests
        run: |
          cmake -S tests -B build/tests
          cmake --build build/tests -j4
      - name: Run tests
        run: ctest --test-dir build/tests --output-on-failure
