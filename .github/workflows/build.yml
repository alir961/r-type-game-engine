name: Build
on:
  push:
  pull_request:
jobs:
  build-project:
    name: Build Project
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.1
      - name: Configure Project
        uses: threeal/cmake-action@v1.3.0
      - name: Generate Project Makefile
        runs: cmake -B build/out -S .
      - name: Build Project
        runs: make -C build/out
