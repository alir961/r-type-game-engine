name: Build
on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'
jobs:
  build-project:
    name: Build Project
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.1
      - name: Configure Project
        uses: threeal/cmake-action@v1.3.0
      - name: Run vcpkg
        uses: lukka/run-vcpkg@v4
        with:
          vcpkgArguments: 'install'
      - name: Generate Project Makefile
        run: cmake -B build/out -S .
      - name: Build Project
        run: make -C build/out
