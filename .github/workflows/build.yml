name: Build
on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'
jobs:
  build-project:
    name: Build Project
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.1
      - name: Install dependencies and build
        run: ./install.sh --deps
      - name: Multiplayer integration test
        run: python3 tests/integration/multiplayer_test.py build/out/server/r-type_server

  unit-tests:
    name: Engine unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build tests
        run: |
          cmake -S tests -B build/tests
          cmake --build build/tests -j4
      - name: Run tests
        run: ctest --test-dir build/tests --output-on-failure
