name: Build
on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - 'main'
jobs:
  build-project:
    name: Build Project
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libx11-dev libxrandr-dev libxcursor-dev libxi-dev libudev-dev libgl1-mesa-dev
          
          git clone https://github.com/microsoft/vcpkg.git
          cd vcpkg
          ./bootstrap-vcpkg.sh
          ./vcpkg integrate install

      - name: Build with CMake and vcpkg
        run: |
          mkdir build
          cd build
          cmake -D CMAKE_C_COMPILER="/bin/gcc" -D CMAKE_CXX_COMPILER="/bin/g++" -D CMAKE_MAKE_PROGRAM="/bin/make" -DCMAKE_TOOLCHAIN_FILE=../vcpkg/scripts/buildsystems/vcpkg.cmake ..
          cmake --build . -- VERBOSE=1

  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build-project
    steps:
      - uses: actions/checkout@master
      - name: Archive Release
        uses: thedoctor0/zip-release@0.7.5
        with:
          type: 'zip'
          filename: 'R-Type-Release.zip'
      - name: Upload Release
        uses: ncipollo/release-action@v1.12.0
        with:
          artifacts: "R-Type-Release.zip"
          tag: "Development"
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true