name: Build
on:
  push:
    branches:
      - 'main'
      - '3-build-project-with-github-actions'
  pull_request:
    branches:
      - 'main'
      - '3-build-project-with-github-actions'
jobs:
  build-project:
    name: Build Project
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.1
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libx11-dev libxrandr-dev libxcursor-dev libxi-dev libudev-dev libgl1-mesa-dev
          
          git clone https://github.com/microsoft/vcpkg.git
          cd vcpkg
          ./bootstrap-vcpkg.sh
          ./vcpkg integrate install
      - name: Build with CMake and vcpkg
        run: |
          mkdir build
          cd build
          cmake -D CMAKE_C_COMPILER="/bin/gcc" -D CMAKE_CXX_COMPILER="/bin/g++" -D CMAKE_MAKE_PROGRAM="/bin/make" -DCMAKE_TOOLCHAIN_FILE=../vcpkg/scripts/buildsystems/vcpkg.cmake ..
          cmake --build . -- VERBOSE=1